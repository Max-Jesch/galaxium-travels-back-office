# The CRM's deals: the open pipeline first, then every deal closed since January 2098.
# Closed deals from the third quarter of 2099 live in the win-loss scenario pack.
# The term of every won deal is in contracts.yaml; the build fails without one.
#
# A deal is flying under contract: a block of seats or a whole ship on a contract
# departure, on the Luna shuttle or on a leg we fly anyway. Its amount is base fares at
# the rate card (sales/rate-card-2099.xlsx in the drive, written by scripts/routine.py)
# less the discount, plus port fees charged at cost. Where a note names seats, the
# arithmetic has to work out; check it against the rate card before changing either.
- id: D-2101
  name: Europa Research Trust, Pluto field season 2100
  account_id: A-106
  owner: Lena Fischer
  stage: proposal
  amount: 38000000
  close_date: 2099-12-15
  next_step: Send revised proposal once a second monthly Pluto departure is confirmed or ruled out.
  notes:
    - {author: Lena Fischer, date: 2099-10-21, text: "Call with Dr. Aydin. They need two Pluto departures a month from March to June. One departure does not work for crew rotation."}
    - {author: Lena Fischer, date: 2099-10-22, text: "What the amount is: a team of four at Tombaugh, half of it relieved every two weeks. The seats on our scheduled departure they book on the site. The contract is the second departure: two seats on each of four, eight seats at the Pluto fare of 5,000,000 less 5%. The way home is in the fare."}
- id: D-2102
  name: Outer Belt Logistics, crew rotation renewal
  account_id: A-104
  owner: Dev Malhotra
  stage: negotiation
  amount: 52000000
  close_date: 2099-11-28
  next_step: Legal to return the redlined master agreement.
  notes:
    - {author: Dev Malhotra, date: 2099-10-29, text: "Imani wants holds extended beyond 15 minutes for group bookings. Told her I would ask engineering."}
    - {author: Dev Malhotra, date: 2099-10-30, text: "The contract as renewed: a block on Halcyon's monthly leg out to Jupiter for the depot crews, and reserved seats home on Aurora's way back. Their people on the scheduled departures book on the site, which is where the hold request comes from."}

