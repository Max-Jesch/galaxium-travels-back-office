# What Sales signed: the term of every won deal since January 2098, and the contracts
# whose signed document is in the drive.
#
# Source for sales/contracts/contract-register.xlsx, for the charter orders in
# sales/contracts/, for the account plans in sales/accounts/ and for
# finance/analysis/charter-revenue-by-quarter.xlsx (scripts/documents.py). A contract
# has the number of its deal: deal D-1744 is contract GC-1744. Amounts, accounts and
# signing dates are read from the CRM and are not repeated here.
#
# `terms` gives the first and the last month of travel. It lists the won deals of the
# win-loss pack too (D-2001 to D-2017), because a signed contract runs whether or not a
# scenario is switched on. The build fails if a won deal has no term.
