# The charter orders in the drive. `lines` are seats times a rate of the rate card,
# `discount` is a percentage of the base fares, `extras` are amounts that are not base
# fares. The build fails if they do not add up to the amount of the deal.
# The order of Vesta Shipwrights for 2100 (D-2019) is written by documents.py itself.
documents:
  - deal: D-1711
    file: pallas-survey-group-belt-rotations-2098
    signer: [Kofi Mensah, Survey Operations]
    flying: "Eighteen seats for survey staff on the Belt call from Olympus Port, from April to December 2098. The call is flown twice a month. The relieved surveyor rides home on the same call: the way home is included in the fare."
    lines: [[18, "Mars to the Belt, economy", 1300000]]
    payment: "Monthly in arrears, 30 days net."
    special: ["The dates of the Belt call are those of Annex A. Galaxium gives 14 days' written notice of a change.", "The customer's own dock is not used: surveyors transfer at Vesta Yard."]
  - deal: D-1714
    file: helix-mining-rotation-charter-2098
    signer: [Grigor Abashidze, Chief Operating Officer]
    flying: "Two whole-ship departures on dates fixed in Annex A: one from Cape Meridian to Olympus Port in the spring and one from Olympus Port to Cape Meridian in the autumn. Ten seats each, one crew."
    lines: [[1, "Whole ship, Earth to Mars", 20000000], [1, "Whole ship, Mars to Earth", 19000000]]
    payment: "Half on signing, half 30 days before the second departure."
    special: ["The dates of Annex A are fixed for the term. Neither party may move a departure.", "Names are supplied seven days before each departure."]
  - deal: D-1715
    file: ceres-agritech-harvest-crews-2098
    signer: [Luis Carvalho, Operations Director]
    flying: "Sixteen seats for harvest crews on the Belt call from Olympus Port to Ceres Station, from May to October 2098. The call is flown twice a month. The way home is included in the fare."
    lines: [[16, "Mars to the Belt, economy", 1300000]]
    payment: "Monthly in arrears, 30 days net."
    special: ["The dates of the Belt call are those of Annex A. Galaxium gives 14 days' written notice of a change."]
  - deal: D-1721
    file: europa-research-trust-summer-relief-2098
    signer: [Selma Aydin, Programme Office]
    flying: "Six seats from Cape Meridian to Ganymede Gate on the monthly leg of the Halcyon, from June to September 2098. From Ganymede Gate the travellers continue to Europa on the scheduled service, which they book on the public site and which is not part of this order."
    lines: [[6, "Earth to Jupiter, economy", 3000000]]
    payment: "By quarter in arrears, 30 days net."
    special: ["Scientific equipment above the baggage allowance travels as cargo and is arranged through Support."]
  - deal: D-1727
    file: red-sands-hospitality-winter-guests-2098-99
    signer: [Yusuf Demir, Commercial Director]
    flying: "Nine guests from Cape Meridian to Olympus Port and back on the contract rotation, between December 2098 and February 2099."
    lines: [[9, "Earth to Mars and Mars to Earth, economy", 1950000]]
    discount: 10
    discount_why: "The partner rate. Red Sands sells the stay and Galaxium the trip, and each names the other in its offer."
    payment: "By quarter in advance."
    special: ["Guest names are supplied 72 hours before departure.", "A guest may be moved to another rotation of the same winter at no fee up to 72 hours before departure."]
  - deal: D-1728
    file: lunar-polytechnic-semester-transfers-2098-99
    signer: [Jonas Weber, Finance Officer]
    flying: "Seventeen seats on the Luna shuttle between Cape Meridian and Tycho Spaceport for students and staff, from September 2098 to February 2099. The shuttle leaves Cape Meridian in the evening and docks at Tycho in the night. The way home is included in the fare."
    lines: [[17, "Earth to Moon, economy", 500000]]
    payment: "One invoice per semester, 30 days net."
    special: ["The institute names the travellers and the shuttle night 72 hours ahead."]
  - deal: D-1740
    file: europa-research-trust-field-season-2099
    signer: [Selma Aydin, Programme Office]
    flying: "Ten seats from Cape Meridian to Ganymede Gate on the monthly leg of the Halcyon, from March to August 2099. The continuation to Europa and the way home from Europa are scheduled departures, which the travellers book on the public site and which are not part of this order."
    lines: [[10, "Earth to Jupiter, economy", 3000000]]
    payment: "By quarter in arrears, 30 days net."
    special: ["Scientific equipment above the baggage allowance travels as cargo and is arranged through Support.", "No more than three seats on one departure."]
  - deal: D-1744
    file: outer-belt-logistics-crew-rotation-2099
    signer: [Imani Okeke, Head of Crew Planning]
    flying: "Twelve depot crew changes in 2099, one a month. The crew member going out has a seat on the monthly leg of the Halcyon from Cape Meridian to Ganymede Gate. The crew member coming off has a reserved seat on the Aurora's way back from Ganymede Gate to Olympus Port."
