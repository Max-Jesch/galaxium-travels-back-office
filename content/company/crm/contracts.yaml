    payment: "Monthly in arrears, 30 days net, as in the master agreement of 2095."
    special: ["The master agreement between the parties of 2095 applies in place of the Galaxium master terms where the two differ.", "Travel between Olympus Port and Earth is on the scheduled service and is not part of this order."]
