position:
  what: "The smallest of the four scheduled carriers, and the only one that sells a single seat to Pluto on a public site at a price that holds."
  market: "About 190,000 seats were sold between the planets in 2098, by the count of Interplanetary Travel Weekly. We sold 832 of them. We are not in the business of carrying most people: we carry the ones for whom a ship of ten, a fixed price and a seat booked in minutes is worth it."
  against:
    - {name: Orbitway, they: "The largest on the inner routes: 24 ships of 80 to 120 seats, flying since 2071. Sells frequency.", we: "Fly beyond Jupiter. They do not."}
    - {name: NovaTransit, they: "Low fares on Earth, Luna and Mars: 15 ships of 160 seats, flying since 2084. Holds the Lunar Free Port's franchise for public seats with Orbitway.", we: "Fly beyond Mars, and keep to the schedule."}
    - {name: Stellar Lines, they: "The widest outer-system network: 11 ships of 40 to 60 seats, flying since 2068, Pluto twice a month. 10% to 20% above our fares.", we: "Cost less, and are booked in minutes instead of by contract."}

why_founded: "Until the 2090s a seat to Mars was bought by contract, through an agent, weeks ahead, on a ship built for a hundred. In 2091 Hadley Yards showed the Kestrel class: ten seats, a crew of three, turned round in 90 minutes. Galaxium was founded the next year to fly it on a timetable and sell each seat the way a train ticket is sold: one price, one page, one traveller at a time."
