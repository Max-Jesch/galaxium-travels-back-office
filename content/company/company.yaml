  finance: Chidi Eze
  sales: Sinead Byrne
  marketing: Elise Fontaine
  support: Greta Olsen
  legal: Sam Whitlock
  ops: Yuki Tanaka
  engineering: Marcus Lindqvist
  people: Dorothea Klein
